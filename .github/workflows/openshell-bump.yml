name: OpenShell version bump

# Monday 16:00 UTC is 09:00 America/Phoenix (UTC-7, no daylight saving).
# That is after the 15:15 UTC image cron, so the daily plan finishes before
# this run commits. A GITHUB_TOKEN push does not start other workflows;
# the publish job dispatches OpenShell images with publish=release, which
# skips the age and change gates.
#
# Verify builds the images and does not push them. A failed verify commits
# nothing. The concurrency group is not the image workflow's group: sharing
# it would deadlock the dispatch while this run still holds the group.

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openshell-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump version files
        id: bump
        env:
          OPENSHELL_BUMP_CACHE: ${{ runner.temp }}/bump-cache
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "run this workflow from main; refusing ${GITHUB_REF}" >&2
            exit 1
          fi
          summary="${RUNNER_TEMP}/summary.txt"
          bash openshell/scripts/bump-versions.sh --summary-file "$summary"
          if git diff --quiet -- openshell/versions .github/workflows; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "No version changes." >>"$GITHUB_STEP_SUMMARY"
          else
            mkdir -p bump-out
            git diff --binary -- openshell/versions .github/workflows >bump-out/bump.patch
            cp "$summary" bump-out/summary.txt
            echo "changed=true" >>"$GITHUB_OUTPUT"
            {
              echo "### Version bumps"
              echo
              sed 's/^/- /' bump-out/summary.txt
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the patch
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-patch
          path: bump-out/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump-patch
          path: bump-out

      - name: Apply the patch
        run: |
          set -euo pipefail
          git apply --check bump-out/bump.patch
          git apply bump-out/bump.patch

      - name: Install just
        run: bash openshell/scripts/install-just.sh

      - name: Build every image (${{ matrix.arch }})
        run: just openshell::all

  publish:
    needs: [bump, verify]
    if: needs.bump.outputs.changed == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump-patch
          path: bump-out

      - name: Commit and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --check bump-out/bump.patch
          git apply bump-out/bump.patch
          git add -- openshell/versions .github/workflows
          git diff --cached --quiet && {
            echo "patch produced no staged changes" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          domain="users.noreply.github.com"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@${domain}"
          mapfile -t lines <bump-out/summary.txt
          if [[ ${#lines[@]} -eq 0 ]]; then
            echo "summary is empty" >&2
            exit 1
          fi
          if [[ ${#lines[@]} -eq 1 ]]; then
            git commit -m "${lines[0]}"
          else
            {
              printf 'bump openshell versions\n\n'
              printf '%s\n' "${lines[@]}"
            } >"${RUNNER_TEMP}/commit-message.txt"
            git commit -F "${RUNNER_TEMP}/commit-message.txt"
          fi
          git push origin HEAD:main
          gh workflow run openshell-images.yml --ref main -f publish=release

  notify:
    needs: [bump, verify, publish]
    if: always() && (needs.bump.result == 'failure' || needs.verify.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="OpenShell version bump failed"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n' \
            "The OpenShell version bump workflow failed." \
            "Run: ${url}" \
            "A failed image build commits nothing. A failed publish may have pushed the version commit before the release dispatch; check main before re-running.")
          number=$(gh issue list --state open --limit 50 --json number,title \
            --jq '.[] | select(.title == "OpenShell version bump failed") | .number' | head -n 1)
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
