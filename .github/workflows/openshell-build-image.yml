name: Build one OpenShell image

on:
  workflow_call:
    inputs:
      recipe:
        description: just recipe under the openshell module
        required: true
        type: string
      image:
        description: ghcr.io image name without a tag
        required: true
        type: string
      publish:
        description: edge or release
        required: true
        type: string
      image_version:
        description: OCI version label. edge, or YYYY.MM.DD.NN
        required: true
        type: string
      short_sha:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      no_cache:
        required: true
        type: boolean
      base_image:
        description: Parent image pinned by manifest-list digest. Empty for agent-cli.
        required: false
        type: string
        default: ""
      base_digest:
        description: Same digest as base_image, without the image name.
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: Manifest list digest, including the sha256 prefix
        value: ${{ jobs.merge.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ inputs.recipe }} (${{ matrix.platform }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        run: bash openshell/scripts/install-just.sh

      - name: Build and push by digest
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ inputs.image }}
          RECIPE: ${{ inputs.recipe }}
          NO_CACHE: ${{ inputs.no_cache }}
          OPENSHELL_GIT_SHA: ${{ inputs.git_sha }}
          OPENSHELL_IMAGE_VERSION: ${{ inputs.image_version }}
          OPENSHELL_BASE_IMAGE: ${{ inputs.base_image }}
          OPENSHELL_BASE_DIGEST: ${{ inputs.base_digest }}
        run: bash openshell/scripts/ci-build.sh

      - name: Attest arch image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign arch image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.recipe }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ inputs.recipe }} manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ inputs.recipe }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create manifest list
        id: merge
        env:
          IMAGE: ${{ inputs.image }}
          PUBLISH: ${{ inputs.publish }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          SHORT_SHA: ${{ inputs.short_sha }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: bash openshell/scripts/ci-merge.sh

      - name: Attest manifest list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign manifest list
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
